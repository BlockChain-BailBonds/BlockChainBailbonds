name: Validate GhostConnect
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r requirements-test.txt
      - name: Backend tests
        run: pytest -q
      - name: Syntax check
        run: python -m compileall -q app
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable container (includes browser Twilio SDK)
        run: docker build -t ghostconnect:ci .
