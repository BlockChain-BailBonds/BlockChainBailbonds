[platformio]
default_envs = core-s3, sentinel-c3
src_dir = firmware

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I shared

[env:core-s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
build_src_filter = +<core-s3/src/> +<../shared/protocol.cpp>

[env:sentinel-c3]
board = lolin_c3_mini
build_src_filter = +<sentinel-c3/src/>

[env:vision-s3cam]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags = ${env.build_flags} -DS1R3N_CAMERA_PROFILE=1
build_src_filter = +<vision-s3cam/src/>

[env:deck-cyd]
board = esp32dev
build_src_filter = +<deck-cyd/src/>
