<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>918 Bail Bonds Advisory Review</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;background:#101827;color:#eef2ff}
    main{background:#172238;border:1px solid #33415c;border-radius:16px;padding:1.5rem}
    label{display:grid;gap:.35rem;margin:.7rem 0} input{padding:.65rem;border-radius:8px;border:1px solid #52627d;background:#0f172a;color:inherit}
    button{padding:.7rem 1rem;border:0;border-radius:8px;background:#f43f5e;color:white;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;background:#0b1220;padding:1rem;border-radius:10px;overflow:auto}.notice{color:#fda4af}
  </style>
</head>
<body><main>
  <h1>918 Bail Bonds — Advisory Review</h1>
  <p class="notice"><strong>Demo only:</strong> do not enter real personal information. This organizes workflow evidence; it is not a risk, eligibility, detention, pricing, or legal decision.</p>
  <form id="form">
    <label>Demo client name<input name="full_name" value="Alex Example"></label>
    <label>Demo date of birth<input name="date_of_birth" value="1990-01-01"></label>
    <label>Demo phone<input name="phone" value="918-555-0100"></label>
    <label>County<input name="county" value="Tulsa"></label>
    <label><span><input name="consent" type="checkbox" checked> Consent recorded</span></label>
    <label><span><input name="emergency" type="checkbox"> Client marked emergency</span></label>
    <label>Public-source matches to review<input name="source_matches" type="number" min="0" value="1"></label>
    <button>Generate advisory packet</button>
  </form>
  <pre id="output">Submit synthetic demo values to generate a packet.</pre>
</main>
<script>
const form=document.getElementById('form'), output=document.getElementById('output');
form.addEventListener('submit', e=>{e.preventDefault(); const d=new FormData(form); const required=['full_name','date_of_birth','phone','consent']; const missing=required.filter(k=>!d.get(k)); const matches=Number(d.get('source_matches')||0); const actions=[]; if(missing.length) actions.push('collect_missing_consented_intake_fields'); actions.push(matches?'licensed_bondsman_confirm_source_match':'licensed_bondsman_review_source_status'); actions.push('licensed_bondsman_record_human_decision'); const suggestion=missing.length?'request_missing_information_before_bondsman_review':matches?'confirm_public_source_evidence_with_licensed_bondsman':'escalate_to_licensed_bondsman_for_source_and_case_review'; const packet={assessment_type:'non_binding_case_readiness',decision:'human_review_required',risk_assessment_suggestion:{suggested_next_step:suggestion,reason:'Workflow suggestion only; no automated bail-risk or detention determination is made.',approval_authority:'licensed_bondsman_and_applicable_court_process'},workflow_priority:d.get('emergency')?'urgent':'standard',missing_information:missing,evidence_summary:{source_match_count:matches,human_source_confirmation_required:true},required_human_actions:actions,explanation:'Workflow evidence only; not a risk, eligibility, detention, pricing, or legal decision.'}; output.textContent=JSON.stringify(packet,null,2);});
</script>
</body></html>
