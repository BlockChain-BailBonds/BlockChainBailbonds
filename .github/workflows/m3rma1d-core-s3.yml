name: M3rMa1d S1r3n S3-CAM

on:
  push:
    branches:
      - feat/m3rma1d-s1r3n-integrated-firmware
      - main
    paths:
      - 'm3rma1d-s1r3n/firmware/s3-cam/**'
      - '.github/workflows/m3rma1d-core-s3.yml'
  pull_request:
    paths:
      - 'm3rma1d-s1r3n/firmware/s3-cam/**'
      - '.github/workflows/m3rma1d-core-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-s3-cam:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: m3rma1d-s1r3n/firmware/s3-cam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build S3-CAM
        run: pio run
      - name: Archive firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: M3rMa1d-S3-CAM-${{ github.sha }}
          path: |
            m3rma1d-s1r3n/firmware/s3-cam/.pio/build/s3-cam/firmware.bin
            m3rma1d-s1r3n/firmware/s3-cam/.pio/build/s3-cam/bootloader.bin
            m3rma1d-s1r3n/firmware/s3-cam/.pio/build/s3-cam/partitions.bin
          if-no-files-found: error
