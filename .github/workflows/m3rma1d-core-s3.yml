name: M3rMa1d S1r3n S3-CAM

on:
  push:
    branches:
      - feat/m3rma1d-s1r3n-integrated-firmware
      - main
    paths:
      - 'm3rma1d-s1r3n/src/**'
      - 'm3rma1d-s1r3n/include/**'
      - 'm3rma1d-s1r3n/data/**'
      - 'm3rma1d-s1r3n/platformio.ini'
      - 'm3rma1d-s1r3n/partitions.csv'
      - '.github/workflows/m3rma1d-core-s3.yml'
  pull_request:
    paths:
      - 'm3rma1d-s1r3n/src/**'
      - 'm3rma1d-s1r3n/include/**'
      - 'm3rma1d-s1r3n/data/**'
      - 'm3rma1d-s1r3n/platformio.ini'
      - 'm3rma1d-s1r3n/partitions.csv'
      - '.github/workflows/m3rma1d-core-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-s3-cam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: m3rma1d-s1r3n
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.18'
      - name: Build S3-CAM firmware
        run: pio run
      - name: Build LittleFS image
        run: pio run -t buildfs
      - name: Archive firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: M3rMa1d-S1r3n-S3-CAM-${{ github.sha }}
          path: |
            m3rma1d-s1r3n/.pio/build/m3rma1d_s1r3n/firmware.bin
            m3rma1d-s1r3n/.pio/build/m3rma1d_s1r3n/bootloader.bin
            m3rma1d-s1r3n/.pio/build/m3rma1d_s1r3n/partitions.bin
            m3rma1d-s1r3n/.pio/build/m3rma1d_s1r3n/littlefs.bin
          if-no-files-found: error
